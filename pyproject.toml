[tool.poetry]
name = "online-cinema"
version = "0.1.0"
description = "Online Cinema API (FastAPI)"
authors = ["Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.32" }
pydantic-settings = "^2.6"
email-validator = "^2.2"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = ">=0.30"
alembic = "^1.14"
pyjwt = "^2.10"
bcrypt = "^4.2"
python-multipart = ">=0.0.17"
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.2"
boto3 = "^1.35"
stripe = "^11.2"
jinja2 = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = ">=0.24"
pytest-cov = "^6.0"
httpx = ">=0.28"
aiosqlite = ">=0.20"
flake8 = "^7.1"
black = "^24.10"
mypy = "^1.13"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
